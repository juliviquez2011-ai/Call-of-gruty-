<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gru vs Minions</title>
<style>
body,html{margin:0;padding:0;overflow:hidden;background:#111}
canvas{display:block;background:#222}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

//--- Configuración ---
const GRU={x:100,y:canvas.height-150,w:50,h:80,vy:0,jumpForce:-15,gravity:0.8,color:'#ff0'};
const bullets=[];
const minions=[];
const obstacles=[];
let keys={};

//--- Entrada ---
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('click',()=>shoot());

//--- Lógica ---
function shoot(){
bullets.push({x:GRU.x+GRU.w, y:GRU.y+GRU.h/2, vx:8, w:10, h:5});
}
function spawnMinion(){
const size=40;
minions.push({x:canvas.width, y:canvas.height- size-50, w:size, h:size, speed:2});
}
function spawnObstacle(){
const w=80, h=30;
obstacles.push({x:canvas.width, y:canvas.height- h-20, w, h, speed:2});
}
setInterval(spawnMinion,2000);
setInterval(spawnObstacle,3000);

//--- Bucle ---
function update(){
// movimiento Gru
if(keys['ArrowRight']) GRU.x+=5;
if(keys['ArrowLeft']) GRU.x-=5;
if(keys[' '] && GRU.onGround){
GRU.vy=GRU.jumpForce;
GRU.onGround=false;
}
GRU.vy+=GRU.gravity;
GRU.y+=GRU.vy;
if(GRU.y+GRU.h>=canvas.height-20){
GRU.y=canvas.height-20-GRU.h;
GRU.vy=0;
GRU.onGround=true;
}

// balas
bullets.forEach((b,i)=>{ b.x+=b.vx; if(b.x>canvas.width) bullets.splice(i,1); });

// minions
minions.forEach((m,i)=>{ m.x-=m.speed; if(m.x+m.w<0) minions.splice(i,1); });

// obstáculos
obstacles.forEach((o,i)=>{ o.x-=o.speed; if(o.x+o.w<0) obstacles.splice(i,1); });

// colisión bala‑minion
bullets.forEach((b,bi)=>{
minions.forEach((m,mi)=>{
if(b.x<b.x+b.w && b.x+b.w>m.x && b.y<b.y+b.h && b.y+b.h>m.y){
bullets.splice(bi,1);
minions.splice(mi,1);
}
});
});

// colisión Gru‑obstáculo
obstacles.forEach(o=>{
if(GRU.x<o.x+o.w && GRU.x+GRU.w>o.x && GRU.y<o.y+o.h && GRU.y+GRU.h>o.y){
// simple reset
GRU.x=100; GRU.y=canvas.height-150;
}
});
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
// suelo
ctx.fillStyle='#444'; ctx.fillRect(0,canvas.height-20,canvas.width,20);
// Gru
ctx.fillStyle=GRU.color; ctx.fillRect(GRU.x,GRU.y,GRU.w,GRU.h);
// balas
ctx.fillStyle='#ff0';
bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
// minions
ctx.fillStyle='purple';
minions.forEach(m=>ctx.fillRect(m.x,m.y,m.w,m.h));
// obstáculos
ctx.fillStyle='brown';
obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
